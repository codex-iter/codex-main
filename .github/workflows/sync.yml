name: Sync Member Stats

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: "0 0,12 * * *"
  # Allows manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    name: Run Stats Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Stats Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEADERBOARD_GH_PAT: ${{ secrets.LEADERBOARD_GH_PAT }}
        run: python scripts/sync_stats.py
